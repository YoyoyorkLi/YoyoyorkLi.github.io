<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pulse dashboard</title>
<style>
/* Pulse — palette lifted from pulse/config.py so the PWA and the Python-rendered
   charts stay one design system. Dark only, on purpose: this is read in bed. */
:root{
  --bg:#0B0E14; --panel:#141924; --panel2:#1C2230; --grid:#252C3B;
  --text:#E6EAF2; --muted:#7E8AA3; --dim:#5A6478;
  --deep:#3B4EE0; --light:#5B8DEF; --rem:#9B5BEF; --awake:#F2A93B;
  --strain:#2FD4C6; --good:#3FD68A; --warn:#F2545B; --accent:#5B8DEF;
  --drink:#C4862E; --steps:#4FB8A8; --workout:#D65BA8;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  --tabbar-h:60px;
  --top-gap:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:400 15px/1.55 var(--sans);
  padding:max(22px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));
}
.screen{max-width:760px;margin:0 auto}
/* On a phone in standalone mode the fixed tab bar was seen ~47px (the top
   safe-area inset) above the bottom of the screen, but ONLY on pages shorter
   than the screen -- Workouts and Drinks -- and flush on the tall ones (Day,
   Trends). A document that cannot scroll appears to get a different layout
   viewport there. One pixel of overflow makes every page a scrollable one, which
   is the state the tall pages are in, and costs nothing anyone can see.
   Touch only: on a desktop it would put a scrollbar on every short page.
   This is a fix to a symptom, reasoned from screenshots, on a platform the
   dev browser is not -- if the bar still floats, ?debug now prints its position
   on every tab switch (barDbg in app.js), which is what to read next. */
@media (pointer:coarse){body{min-height:calc(100vh + 1px)}}
/* The fixed tab bar sits over the bottom of the page; leave room for it, plus
   the home-indicator inset it grows by, so the last card is never under it. */
#dash{padding-bottom:calc(var(--tabbar-h) + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
a{color:var(--accent)}

.top{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:var(--top-gap)}
/* Workouts, Drinks and Trends have no header row (the night selector is Day-only),
   so their first card would sit hard against the status bar. The same gap the Day
   page leaves between its header and its dials, on purpose this time: it used to
   come from the hidden header's own margin, which was an accident and read as the
   pages starting lower than Day's header. */
#workouts,#drinks,#trends{padding-top:var(--top-gap)}
/* Trends opens on a chart card, not a calendar or a button, and at the shared gap
   it read as crowding the status bar. A little more, for that page only. */
#trends{padding-top:calc(var(--top-gap) + 12px)}

/* Night selector. Meets Apple's 44px touch-target advice now that there is no
   brand wordmark left to crowd off a 320px screen for it. Arrow keys and the
   swipe gesture are the other two ways in. */
.daynav{display:flex;align-items:center;gap:5px}
.nav{background:var(--panel);border:1px solid var(--grid);color:var(--text);
  width:52px;height:52px;line-height:1;font-size:27px;padding:0;border-radius:9px;
  display:flex;align-items:center;justify-content:center}
.nav:disabled{opacity:.32;cursor:default}
.stamp{background:none;border:0;color:var(--muted);font:inherit;font-size:12.5px;
  padding:6px 8px;min-width:104px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.3}
/* The date never wraps; the freshness line under it may. */
.stamp .d{display:block;white-space:nowrap}
.stamp .s{display:block;font-size:11px}
/* Only looks tappable once tapping it would do something. */
.daynav.stepped .stamp{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* Night picker button: sits with the ‹ › pair (it is navigation, not an action),
   muted like the sync glyph so the date stays the loudest thing in the header. */
.cal{color:var(--muted)}
.nav svg{display:block}

/* Sync now. Set apart from the ‹ › pair so a thumb reaching for "previous"
   does not start a four-minute job by accident. */
.sync{margin-left:8px;font-size:23px;color:var(--muted)}
/* Static on purpose. A spinner implies this page is doing the work; it is not
   -- the run is on GitHub and takes ~4 minutes, so an animation here would be
   four minutes of motion signifying nothing. The colour change plus "syncing…"
   in the stamp carry the state. */
.sync[disabled]{opacity:1;color:var(--accent);cursor:default}
/* Two missed hourly runs, or a run that reported failure. Amber rather than
   red: stale data is worth a look, not an alarm, and the tap path keeps
   working regardless of whether the sync does. */
.daynav.stale .stamp{color:var(--awake)}

/* Bottom tab bar: four equal cells, an icon over a label. Fixed to the viewport
   rather than the 760px column, then capped to that column's width and centred,
   so on a desktop window it stays phone-shaped like .picker does. Its own bottom
   padding is the home-indicator inset, so the cells keep their full height and
   the bar just grows underneath them. z-index 15 sits under the pastbar (20) and
   every .detail overlay (25/30), which cover it on purpose.
   Translucent with a blur so a card scrolling under it is softened rather than
   cut off by a hard edge; the alpha is high enough that the labels never sit on
   a busy chart line. Browsers without backdrop-filter get the same colour at
   near-full opacity, which is just a solid bar. */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:15;
  max-width:760px;margin:0 auto;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:rgba(20,25,36,.94);
  -webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);
  border-top:1px solid var(--grid);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{position:relative;height:var(--tabbar-h);padding:6px 4px 0;
     display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
     background:none;border:0;border-radius:0;color:var(--dim);
     font:inherit;font-size:10.5px;font-weight:500;letter-spacing:.03em;line-height:1;
     cursor:pointer;-webkit-tap-highlight-color:transparent;transition:color .15s}
.tab svg{width:23px;height:23px;display:block}
/* Dividers: equal, but inset to the middle of the cell rather than running the
   full height, so the bar reads as one surface with four stops on it and not as
   four boxes. */
.tab + .tab::before{content:"";position:absolute;left:0;top:14px;bottom:10px;width:1px;background:var(--grid)}
.tab:active{color:var(--muted)}
.tab[aria-selected="true"]{color:var(--accent);font-weight:600}
/* The selected marker: a short bar hung from the bar's top edge, centred on the
   cell. It moves with the selection, which is the whole "where am I" signal --
   the colour change alone is easy to miss on a dark screen at arm's length. */
.tab[aria-selected="true"]::after{content:"";position:absolute;top:-1px;left:50%;width:30px;height:3px;
  margin-left:-15px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Inside the cell, or the fixed bar's edges clip the ring. */
.tab:focus-visible{outline-offset:-4px}

/* The Trends range toggle: smaller and quieter than .tab, since it governs
   the cards below it rather than switching the whole screen. */
.range{display:flex;gap:6px;margin:-2px 0 14px}
.rbtn{background:var(--panel);border:1px solid var(--grid);color:var(--muted);border-radius:6px;
  padding:5px 12px;font:inherit;font-size:12.5px;font-variant-numeric:tabular-nums}
.rbtn[aria-selected="true"]{background:var(--panel2);border-color:var(--accent);color:var(--text);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:18px 4px 16px;text-align:center;
  font:inherit;color:inherit;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
/* Fill the tile rather than sitting at a fixed 130px inside it: these three are
   the headline numbers and were the smallest thing on the screen. The 150px
   ceiling only ever bound on a wide screen anyway -- a phone's column is
   already narrower than that -- so raising it makes the tile bigger exactly
   where there was room to spare, tablet and desktop, without doing anything
   on a phone. */
.kpi svg{display:block;margin:0 auto;width:100%;max-width:180px;height:auto}
.kpi .cap{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:11px 0 3px}
.kpi .sub{font-size:12.5px;color:var(--dim);margin:0}

/* Drinks annotate the day; they are not a fourth vital sign. */
.strip{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--panel);
  border:1px solid var(--grid);border-left:2px solid var(--drink);border-radius:0 6px 6px 0;
  padding:13px 16px;margin-bottom:14px;font-size:14px}
.strip .n{font-size:19px;font-weight:600;color:var(--drink);font-variant-numeric:tabular-nums}
.strip .txt{color:var(--muted)}
.strip .txt b{color:var(--text);font-weight:500}
.pips{display:flex;gap:4px}
.pips i{width:7px;height:18px;border-radius:2px;background:var(--drink);display:block}

/* Recovery Load status bar -- one line under the dials, colour = state.
   A button (taps into the Recovery detail); reset the UA styling. */
.loadbar{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--panel);border:1px solid var(--grid);border-left:2px solid var(--muted);
  border-radius:0 6px 6px 0;padding:11px 15px;margin-bottom:14px;font:inherit;font-size:13.5px;
  color:var(--muted);cursor:pointer;-webkit-tap-highlight-color:transparent}
.loadbar .lb-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.loadbar .lb-txt b{color:var(--text);font-weight:600}
.loadbar.l1{border-left-color:var(--awake)}
.loadbar.l1 .lb-dot{background:var(--awake)}
.loadbar.l2{border-left-color:var(--warn)}
.loadbar.l2 .lb-dot{background:var(--warn)}
.loadbar.l0{border-left-color:var(--good)}
.loadbar.l0 .lb-dot{background:var(--good)}
/* The nap bar shares the loadbar's layout; purple is sleep everywhere else in
   the app (REM, the sleep-window wash), so a nap wears it too. */
.loadbar.nap{border-left-color:var(--rem)}
.loadbar.nap .lb-dot{background:var(--rem)}
.loadcard.l1{border-left:2px solid var(--awake)}
.loadcard.l2{border-left:2px solid var(--warn)}
.loadcard.l0{border-left:2px solid var(--good)}

.card{background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:18px;margin-bottom:14px}
/* Flex, not the toggles floating in an absolutely-positioned corner: an
   absolute chip has no height as far as the box below it (.readrow, with
   the scrub stepper) is concerned, so the two silently overlapped whenever
   the title's own single-line box was shorter than the chip row. Flex makes
   the header's real height include the chips, so .readrow always starts
   below them, and wrapping (narrow phone, 3 chips) pushes down instead of
   clipping. */
.card h2{font-size:11.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:600;
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 8px}
.card-toggles{display:flex;flex-wrap:wrap;gap:8px}
.chip-toggle{display:inline-flex;align-items:center;gap:6px;
  background:var(--panel2);border:1px solid var(--grid);border-radius:20px;padding:8px 12px;
  font-size:11px;font-weight:600;letter-spacing:.02em;color:var(--muted);text-transform:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent}
.chip-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--grid);flex:none}
.chip-toggle.on{color:var(--text)}
.chip-toggle[data-wo-toggle].on{border-color:var(--workout)}
.chip-toggle[data-wo-toggle].on .dot{background:var(--workout)}
.chip-toggle[data-dr-toggle].on{border-color:var(--drink)}
.chip-toggle[data-dr-toggle].on .dot{background:var(--drink)}
.chip-toggle[data-sl-toggle].on{border-color:var(--rem)}
.chip-toggle[data-sl-toggle].on .dot{background:var(--rem)}
.note{color:var(--muted);font-size:13px;margin:12px 0 0;line-height:1.5}
.note b{color:var(--text);font-weight:500}
/* Charts are authored at the measured pixel width of this box (charts.js takes
   W as an argument), so the viewBox is 1:1 with CSS pixels and font-size 10.5
   is 10.5px on every device. That is what retired the old min-width:520px and
   its horizontal scroll — the scroll only ever existed to stop a fixed 680-unit
   viewBox shrinking type to ~4px on a phone. Nothing here scrolls sideways now,
   so there is no edge-fade to signal either. */
.chartbox svg{display:block;width:100%;height:auto}
/* touch-action:none on the charts, plus a preventDefault on touchstart in
   bindScrub. Together they mean a drag that starts on a chart is the
   scrubber's and cannot scroll the page.

   Read the git history of this block with suspicion. It accumulated four
   rounds of explanation -- pan-y being unimplemented, WebKit resolving
   touch-action from the hit element, text selection eating the gesture -- all
   of it reasoned from a debug log that could not report a moving gesture, and
   none of it the actual bug. The scrubber froze because bindScrub cancelled
   its own drag whenever a thumb rolled downward on contact, and iOS was
   delivering every move event the whole time. See the note above `begin` in
   app.js.

   These declarations are kept because they are correct on their own terms:
   the gesture belongs to the chart and nothing should scroll, select or pop a
   callout underneath it. The descendant selector matters because touch-action
   is not inherited, and the element a finger lands on is a <rect>, never the
   container.

   The cost is real and deliberate: you cannot scroll the page by starting a
   drag on a chart. There is room between the cards to scroll from. If that
   ever becomes annoying, pan-y is worth a fresh try -- the case against it
   was built on the same bad measurement as everything else here. */
.chartbox.scrubbable, .chartbox.scrubbable *,
.chartbox:has(svg[data-scrub]), .chartbox:has(svg[data-scrub]) *{
  touch-action:none;
  -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none;
}
.chartbox svg[data-scrub]{touch-action:none;cursor:crosshair}

/* Where a scrubbed value lands: pinned under the card title, above the chart,
   so a thumb on the chart is never on top of the number it just asked for.
   Reserves its own line whether or not it is populated — a row that appears on
   touch would shove every chart down the page mid-drag. */
/* No generated content on the span, and no text-overflow:ellipsis.
   The device caught the bug this fixes: the ?debug log showed the DOM holding
   "Aug 28|60.8 ms" while the screen displayed "Aug 28 · 69.7 ms", a value
   from two bands earlier. The date repainted; everything to the right of it
   did not. Correct string, stale pixels.
   The separator used to be a ::before on the span -- generated content on
   exactly the element that failed to repaint, inside the -webkit-line-clamp
   box the phone breakpoint below puts this element in. That combination is
   the likely culprit; note that on a phone text-overflow:ellipsis was never
   even active, since the breakpoint overrides white-space to normal. The " · "
   is now part of the span's own text, and the tail is one span rather than
   one per segment.
   Do not reintroduce a pseudo-element here to draw a separator. */
.readout{
  min-height:34px;margin:-8px 0 10px;font-size:14px;line-height:1.3;
  color:var(--dim);font-variant-numeric:tabular-nums;
  white-space:nowrap;overflow:hidden;
}
/* The value you scrubbed to is the thing worth reading at a glance; the date
   or time it happened is context, not the headline. Every chart's data-tip
   puts the value first for exactly this -- see charts.js. */
.readout b{color:var(--muted);font-weight:700;font-size:23px;letter-spacing:-.01em}
.readout span{font-size:13px}
.readout.live{color:var(--muted)}
.readout.live b{color:var(--text)}

/* The readout and its steppers share one row.
   The steppers were added while the drag was still broken, on the theory that
   iOS was withholding move events. It was not -- that was our own bug. They
   have earned their place anyway: on a phone a fingertip covers several days
   of a 7-band chart, so tapping near the value you want and stepping onto it
   beats trying to land on it. They are ordinary buttons OUTSIDE .chartbox, so
   the touch-action:none covering the chart does not reach them.
   The row reserves its height for the same reason the readout always did:
   nothing may move while you are interacting with it. */
.readrow{display:flex;align-items:center;gap:6px;margin:-8px 0 10px}
.readrow .readout{margin:0;flex:1;min-width:0}
.stepper{display:flex;gap:2px;flex:none}
.step{background:var(--panel);border:1px solid var(--grid);color:var(--text);
  width:38px;height:38px;line-height:1;font-size:20px;padding:0;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.step:active{background:var(--panel2)}

/* One row per workout on the Day-strain detail. A list, not a grid: the count
   varies 0-N a day and a fixed column count would leave gaps or wrap oddly.
   A button, not a div: tapping any row opens #workout-day for that date --
   the same screen a marked day on the Workouts calendar opens. */
.worklist{display:flex;flex-direction:column;gap:8px}
.workrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  background:var(--panel2);border-radius:5px;padding:10px 12px;font-size:13.5px;
  width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.workrow .wtype{font-weight:600}
.workrow .wtime{color:var(--muted);font-size:12.5px}
.workrow .wmetrics{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* One row per drink on #drinks-day. Not a button like .workrow -- there is
   nothing further to drill into, only the delete action on the right. */
.drinklist{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.drinkrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:var(--panel2);border-radius:5px;padding:10px 12px;font-size:13.5px}
.drinkrow .wtime{color:var(--text);font-size:14px;font-weight:600}
/* The calendar date of a drink that fell after midnight, under the night it
   belongs to. Quieter than the time: it is context, not the fact. */
.drinkrow .wday{color:var(--muted);font-size:12.5px;font-weight:400;margin-left:8px}
.drdel{background:none;border:1px solid var(--grid);color:var(--muted);border-radius:6px;
  width:34px;height:34px;font-size:17px;line-height:1;flex:none;
  -webkit-tap-highlight-color:transparent}
.drdel:active{color:var(--warn);border-color:var(--warn)}
/* One row: [ Time ] [ Add ]. The earlier stacked layout was a workaround for a
   native <input type="time"> that ignores a percentage / flex-grow width on
   iOS and paints itself wide -- an EXPLICIT px width it does honour, so the
   field is a fixed size and the button sits beside it. flex-wrap is the
   safety net on a very narrow viewport. margin-bottom keeps the heart-rate
   card below from touching the button. */
.drinkadd{display:flex;flex-flow:row wrap;gap:10px 14px;align-items:flex-end;margin-bottom:20px}
.drinkadd .field{margin:0;flex:0 0 auto}
.drinkadd .field span{font-size:12px}
.drinkadd input{width:150px}
.drinkadd button.primary{width:auto;padding:13px 28px;flex:0 0 auto}
/* Its own row under the field and button, whatever the width. */
.drinkadd .note{flex:1 0 100%;margin:0}

/* Drinks tab: "Log a drink now" — the in-app tap. Amber to tie it to drinks;
   the calendar below is for backfilling past nights. */
.lognow{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  appearance:none;-webkit-appearance:none;
  background:var(--drink);color:#0B0E14;border:0;border-radius:6px;
  padding:11px 16px;margin-bottom:16px;font-weight:600;font-size:14.5px;line-height:1.2;
  letter-spacing:-.01em;-webkit-tap-highlight-color:transparent}
.lognow:active{filter:brightness(.92)}
.lognow .plus{font-size:17px;font-weight:500;line-height:1;margin-top:-1px}
.nowlist{margin:0 0 22px}
.nowhd{margin:0 0 8px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.nowhd b{color:var(--text)}
.nowrow{display:flex;align-items:center;gap:12px;background:var(--panel2);
  border-radius:5px;padding:9px 10px 9px 13px;margin-bottom:6px;font-size:14px}
.nowrow .nown{color:var(--dim);font-variant-numeric:tabular-nums;min-width:14px}
.nowrow .nowt{color:var(--text);font-weight:500;flex:1;font-variant-numeric:tabular-nums}
.nowdel{background:none;border:1px solid var(--grid);color:var(--muted);border-radius:6px;
  width:32px;height:32px;font-size:16px;line-height:1;flex:none;
  -webkit-tap-highlight-color:transparent}
.nowdel:active{color:var(--warn);border-color:var(--warn)}

/* #workout-day's per-workout cards: collapsed to time/duration/calories,
   expanding on tap to the heart-rate chart and zone breakdown. The summary
   button IS the card's header -- no separate h2, since the chevron and the
   tap target need to be the same element the glance-able info sits on. */
.wsummary{display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
  font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}
.wsummary .wtype{font-weight:600;font-size:14.5px}
.wsummary .wmeta{flex:1;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;text-align:right}
.wsummary .wchev{color:var(--dim);font-size:16px;line-height:1;width:14px;text-align:center}
.wexpand{margin-top:16px}

/* label-left/value-right rows, lifted from the Google Health app's own
   workout detail screen -- a list reads better than tiles for a set of
   stats that varies by workout type (a walk has distance and pace, a
   weights session has neither). */
.detlist{margin-bottom:16px}
.detrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--grid)}
.detrow:last-child{border-bottom:0}
.detrow .dlabel{color:var(--muted);font-size:13.5px}
.detrow .dvalue{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}

/* Zone bars, same idiom as the Google Health app's own "Time in each zone" --
   a track per zone, filled to that zone's share of the workout, Peak down to
   Light so the bar you're most likely to care about is the first one. */
.zonebars{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.zonebar .zlabel{font-size:13px;font-weight:600;margin:0 0 7px}
.ztrack{background:var(--panel2);border-radius:999px;height:10px;overflow:hidden}
.zfill{height:100%;border-radius:999px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stat{background:var(--panel2);border-radius:5px;padding:16px 8px;text-align:center}
.stat .v{font-size:25px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}

.banner{background:var(--panel);border-left:2px solid var(--muted);padding:12px 16px;margin-bottom:14px;
  font-size:13.5px;color:var(--muted);border-radius:0 4px 4px 0}
.banner b{color:var(--text);font-weight:500}

/* "You are not looking at today." Solid background, not translucent: it sits
   over scrolling charts, and a see-through bar over a heart-rate line is worse
   than no bar. Amber because it is a heads-up, not a failure. */
.pastbar{
  position:sticky;top:0;z-index:20;width:100%;display:block;
  background:var(--panel2);border:1px solid var(--awake);color:var(--awake);
  font:inherit;font-size:12.5px;font-weight:600;padding:10px 12px;
  margin-bottom:12px;text-align:center;
}

/* Card detail: a full-screen drill-down for one of the three Day-tab dials.
   Fixed and layered over #dash rather than swapped in through show() -- the
   thing underneath (day, tab) must come back exactly as it was on close, and
   never tearing it down is the cheapest way to guarantee that. */
.detail{
  position:fixed;inset:0;z-index:25;background:var(--bg);overflow-y:auto;
  padding:max(22px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom));
}
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:22px}
/* Bigger than a kpi tile's ring on purpose: on a tile it shares the row with
   two others and 220px (the old ceiling here too) already crowded them, but
   a full-screen detail has nothing beside it -- at 220px in a ~340px-wide
   phone it read as a small ring adrift in a lot of empty margin rather than
   as the hero of the screen it now is. */
.detail-dial{display:flex;justify-content:center;margin:10px 0 20px}
.detail-dial svg{width:100%;max-width:280px;height:auto}

/* #workout-day can open FROM inside #detail (a workout row on the Strain
   detail) as well as from the Workouts tab -- stacking above it rather than
   sharing the 25 means closing it reveals the Strain detail again instead of
   the Day tab underneath both. */
#workout-day{z-index:30}

/* The Workouts tab: a real calendar, one cell per day of the shown month. */
.calnav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:16px}
.calmonth{font-size:15px;font-weight:600;min-width:150px;text-align:center;margin:0}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calhead{text-align:center;font-size:10.5px;letter-spacing:.06em;color:var(--muted);padding-bottom:6px}
.calcell{

  background:var(--panel);border:1px solid var(--grid);border-radius:6px;padding:0;
  font:inherit;font-size:13px;color:var(--text);font-variant-numeric:tabular-nums;

/* The Day tab's night picker: the same grid, but every loaded night is a target
   and the one you are on is filled. The overlay is fixed to the viewport, so on
   a desktop window it would stretch the grid edge to edge -- the side padding
   keeps it phone-sized there and is the plain 16px gutter on an actual phone. */

.pds .dr{background:var(--drink)}
.pds .wo{background:var(--strain)}
/* margin-bottom is the fix here, not margin-top: .note is 0-bottom by

  const f = ok(v) ? Math.max(0, Math.min(1, v / max)) : 0;
  return svg(130, 104, `
    <path d="${arcPath(cx, cy, r, a0, a1)}" fill="none" stroke="${col("panel2")}" stroke-width="10" stroke-linecap="round"/>
    ${ok(v) ? `<path d="${arcPath(cx, cy, r, a0, a0 + (a1 - a0) * f)}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round"/>` : ""}
    <text x="${cx}" y="${cy + 9}" text-anchor="middle" fill="${col(ok(v) ? "text" : "dim")}" font-size="34" font-weight="600"
      font-family="${SANS}" style="font-variant-numeric:tabular-nums">${ok(v) ? v : "—"}</text>
    <circle cx="${cx}" cy="${cy}" r="${r + 6}" fill="transparent" data-tip="${esc(tip)}"/>`,
    `${label} ${ok(v) ? v : "not available"} of ${max}`);
}

function ring(v, c, label, tip) {
  const cx = 65, cy = 54, r = 43, circ = 2 * Math.PI * r;
  // A caller with no score yet (before tonight's sleep has synced) used to
  // pass a fallback 0, which drew a real-looking empty ring with a giant "0"
  // -- indistinguishable from an actual bad night. And a non-numeric v would
  // make f = NaN, reintroducing the same NaN-stroke-dasharray class of bug
  // fixed in strainHistory. Draw an honest "no data yet" state instead.
  if (!ok(v)) {
    return svg(130, 104, `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col("panel2")}" stroke-width="10"
        stroke-dasharray="3 5"/>
      <text x="${cx}" y="${cy + 11}" text-anchor="middle" fill="${col("dim")}" font-size="28" font-weight="600"
        font-family="${SANS}">—</text>
      <circle cx="${cx}" cy="${cy}" r="${r + 6}" fill="transparent" data-tip="${esc(tip)}"/>`,
      `${label}: not yet available`);
  }
  const f = Math.max(0, Math.min(1, v / 100));
  return svg(130, 104, `
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${col("panel2")}" stroke-width="10"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${c}" stroke-width="10" stroke-linecap="round"
      stroke-dasharray="${(circ * f).toFixed(1)} ${circ.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"/>
    <text x="${cx}" y="${cy + 11}" text-anchor="middle" fill="${col("text")}" font-size="33" font-weight="600"
      font-family="${SANS}" style="font-variant-numeric:tabular-nums">${v}</text>
    <circle cx="${cx}" cy="${cy}" r="${r + 6}" fill="transparent" data-tip="${esc(tip)}"/>`,
    `${label} ${v} of 100`);
}

// --------------------------------------------------------------- hypnogram
// One continuous ribbon, not four stacked totals. Vertical position encodes
// depth, connectors between blocks make the descent through each cycle a
// visible path, and cycle markers land at every REM exit. This is the shape
// the Google Health app draws, and the reason it reads better than a bar
// chart is that alcohol shows up as *structure*: deep sleep front-loaded,
// REM pushed late and short, awakenings clustered in the second half.
const LEVEL = { AWAKE: 0, REM: 1, LIGHT: 2, DEEP: 3 };
// "Rem" is not a word. Title-casing the others and leaving the acronym alone
// is the whole rule, and it is worth the three lines to not print it wrong.
const STAGE_NAME = { AWAKE: "Awake", REM: "REM", LIGHT: "Light", DEEP: "Deep" };
/** "0h 01m" reads badly for a one-minute block; under an hour, drop the hours. */
const dur = (m) => (m < 60 ? `${Math.round(m)}m` : hm(m));

function hypnogram(W, h, ht = 244) {
  if (!h?.segs?.length) {
    return svg(W, 92, txt(W / 2, 50, "no stage data for this night", { anchor: "middle" }), "no stage data");
  }
  // padB carries both the hour ticks and, when present, the HR-floor marker
  // below the ribbon -- a second row bought with 18px, not a second chart.
  const pl = narrow(W) ? 40 : 48, pr = padR(W), padT = 20, padB = 50;
  const iw = W - pl - pr, ih = ht - padT - padB;
  const row = ih / 4, bar = row * 0.6;
  const X = (m) => pl + (m / h.span) * iw;
  const Y = (lvl) => padT + lvl * row + (row - bar) / 2;
  const startMin = (() => { const [a, b] = h.start.split(":").map(Number); return a * 60 + b; })();
  const clock = (m) => clock12(startMin + m);

  const COL = { AWAKE: col("awake"), REM: col("rem"), LIGHT: col("light"), DEEP: col("deep") };
  let p = "";

  for (const [name, lvl] of Object.entries(LEVEL)) {
    const yy = padT + lvl * row + row / 2;
    p += `<line x1="${pl}" y1="${yy.toFixed(1)}" x2="${W - pr}" y2="${yy.toFixed(1)}"
      stroke="${col("grid")}" stroke-width="1" stroke-dasharray="2 4"/>`;
    p += txt(pl - 7, yy + 3.5, narrow(W) ? name[0] : name[0] + name.slice(1).toLowerCase(), { size: 9.5 });
  }

  // connectors first so blocks sit on top
  for (let i = 1; i < h.segs.length; i++) {
    const a = h.segs[i - 1], b = h.segs[i], x = X(b.a);
    p += `<line x1="${x.toFixed(1)}" y1="${(Y(LEVEL[a.t]) + bar / 2).toFixed(1)}"
      x2="${x.toFixed(1)}" y2="${(Y(LEVEL[b.t]) + bar / 2).toFixed(1)}"
      stroke="${COL[b.t]}" stroke-width="2" opacity=".45"/>`;
  }

  for (const s of h.segs) {
    const x0 = X(s.a), wd = Math.max(X(s.b) - x0, 1.4);
    const tip = `${STAGE_NAME[s.t] || s.t} · ${dur(s.b - s.a)}|${clock(s.a)} – ${clock(s.b)}`;
    p += `<rect x="${x0.toFixed(1)}" y="${Y(LEVEL[s.t]).toFixed(1)}" width="${wd.toFixed(1)}"
      height="${bar.toFixed(1)}" rx="${Math.min(2.5, wd / 2).toFixed(1)}" fill="${COL[s.t]}" data-tip="${esc(tip)}"/>`;
  }

  let n = 0;
  for (let i = 1; i < h.segs.length; i++) {
    if (h.segs[i - 1].t === "REM" && h.segs[i].t !== "REM") {
      const xc = X(h.segs[i - 1].b); n++;
      p += `<line x1="${xc.toFixed(1)}" y1="${padT - 5}" x2="${xc.toFixed(1)}" y2="${padT + ih}"
        stroke="${col("muted")}" stroke-width=".8" opacity=".5"/>`;
      p += txt(xc, padT - 8, "C" + n, { size: 8, anchor: "middle" });
    }
  }

  // Hour ticks, strided so a phone gets ~4 rather than 9 overlapping ones.
  // Divisor sized for "11 PM" (5 chars), wider than the old lowercase "11p".
  const hourStep = Math.max(1, Math.ceil(h.span / 60 / Math.max(2, Math.floor(W / 68))));
  for (let m = 60 - (startMin % 60), k = 0; m < h.span; m += 60, k++) {
    if (k % hourStep) continue;
    p += txt(X(m), ht - 30, tick12(startMin + m), { size: 9, anchor: "middle" });
  }

  // The HR floor for the night: how low it went, and how long it took to get
  // there. Deliberately drawn below the ribbon rather than mapped onto its
  // depth axis -- the ribbon's y-position encodes sleep STAGE, not bpm, and
  // stacking a heart-rate value onto that axis would imply a scale that
  // doesn't exist. A time marker, same idiom as the C1/C2 cycle markers
  // above, keeps the two honestly separate while still reading as one night.
  if (ok(h.nadirMin) && ok(h.nadirBpm)) {
    const xn = X(h.nadirMin), yTop = padT + ih, yDot = yTop + 9, yLabel = ht - 8;
    p += `<line x1="${xn.toFixed(1)}" y1="${yTop}" x2="${xn.toFixed(1)}" y2="${yDot - 3}"
        stroke="${col("strain")}" stroke-width="1.25" opacity=".7"/>
      <circle cx="${xn.toFixed(1)}" cy="${yDot}" r="3" fill="${col("strain")}"/>
      ${txt(xn, yLabel, `${h.nadirBpm} bpm floor`, { size: 9.5, anchor: "middle", fill: "strain" })}`;
  }
  // Scrub bands across the night -- same contract as the heart-rate chart, one
  // band per sampled minute carrying the stage under it and the clock time.
  // The per-segment data-tips stop being reachable the moment data-scrub is set
  // (app.js excludes marks inside a scrubbable chart from the floating tooltip),
  // which is the point: a 3px REM sliver at the end of a cycle was never a
  // touch target, and those are exactly the transitions worth reading.
  const nb = Math.max(24, Math.min(320, Math.round(iw)));
  const bw = iw / nb;
  let si = 0;
  for (let i = 0; i < nb; i++) {
    const m = (i + 0.5) * (h.span / nb);
    while (si < h.segs.length - 1 && h.segs[si].b <= m) si++;
    const seg = h.segs[si];
    const name = STAGE_NAME[seg.t] || seg.t;
    p += `<rect data-i="${i}" data-x="${X(m).toFixed(1)}" data-y="${(Y(LEVEL[seg.t]) + bar / 2).toFixed(1)}"
      x="${(X(m) - bw / 2).toFixed(1)}" y="${padT}" width="${bw.toFixed(1)}" height="${ih.toFixed(1)}"
      fill="transparent" data-tip="${esc(`${name} · ${dur(seg.b - seg.a)}|${clock(seg.a)} – ${clock(seg.b)}`)}"/>`;
  }
  p += scrubLayer(padT, padT + ih);
  return svg(W, ht, p, "Sleep stages across the night with cycle markers and the heart-rate floor", "time");
}

// ---------------------------------------------------------------- intraday
// Clock helpers. The stored curve is [["HH:MM", bpm], ...] in local time, so a
// night wraps midnight and the minute-of-day goes backwards halfway through.
// Everything below works in "absolute minutes since the first sample" instead,
// unrolled once here, so the x scale is honestly proportional to time rather
// than to array index — those two disagree wherever the curve has a gap.
const mins = (s) => { const [a, b] = String(s).split(":").map(Number); return a * 60 + b; };
const hhmm = (t) => `${String(Math.floor((t % 1440) / 60)).padStart(2, "0")}:${String(Math.round(t) % 60).padStart(2, "0")}`;
const unroll = (list, t0) => list.map((v) => { let m = mins(v); while (m < t0) m += 1440; return m; });

// Bucket the curve for drawing. push.py stores one point per minute
// (CURVE_BUCKET_SEC = 60), which across a ~16h window is ~960 points — two per
// pixel on a phone, and a scrub band a third of a pixel wide. Five-minute means
// are pixel-identical at any width this chart is ever drawn at and give the
// thumb something to actually land on.
//
// Done here rather than in push.py on purpose: the stored data stays at full
// resolution, so this is reversible, needs no backfill, and does not care that
// Actions only rewrites the last 30 nights.
const BUCKET_MIN = 5;
function bucket(pts, size = BUCKET_MIN) {
  if (pts.length < 2) return pts;
  const t = unroll(pts.map((p) => p[0]), mins(pts[0][0]));
  if (t[1] - t[0] >= size) return pts;            // already this coarse or coarser
  const out = [];
  let key = Math.floor(t[0] / size), acc = [];
  const flush = () => { if (acc.length) out.push([hhmm(key * size), Math.round(acc.reduce((a, b) => a + b, 0) / acc.length)]); };
  pts.forEach((p, i) => {
    const k = Math.floor(t[i] / size);
    if (k !== key) { flush(); acc = []; key = k; }
    acc.push(p[1]);
  });
  flush();
  return out;
}

// The workout detail's "Time in each zone" bars (app.js's zoneBars) use
// Fitbit's own light/moderate/vigorous/peak split and are colored to match
// -- reusing colors already meaningful elsewhere (light = sleep's LIGHT
// stage, good/awake/warn = recovery's own good/moderate/bad) rather than
// inventing a fourth palette just for this.
const WZONE = [col("light"), col("good"), col("awake"), col("warn")];

// Every heart-rate line in the app is coloured per-segment by which of the 5
// Karvonen bands that moment sits in (day_strain() in metrics.py uses the same
// bands) -- green at the low end, red at the top, so "how hard was this moment"
// reads at a glance without a zone-shaded background behind it. The old
// translucent band fill is gone: the line carries the whole story.
const HR_GRADIENT = ["#3FD68A", "#A3D639", "#F2CB3B", "#F2A93B", "#F2545B"];
const zoneEdges5 = (rhr, hrmax) => { const res = hrmax - rhr; return [0, 0.6, 0.7, 0.8, 0.9, 1].map((f) => rhr + res * f); };
const zoneIndex5 = (bpm, edges) => { for (let k = 0; k < 4; k++) { if (bpm < edges[k + 1]) return k; } return 4; };

/**
 * One civil day of heart rate, with Karvonen zone bands and drink markers.
 *
 * push.py stores 00:00-24:00 local, so there is no midnight wrap inside a
 * curve any more and every "HH:MM" here is simply a minute of this day. The
 * chart still fits the extent of the data it actually has rather than padding
 * out to a full 24 hours -- a day in progress ends at the last synced sample,
 * and reserving eight blank hours for the evening you have not lived yet would
 * squeeze the part you opened the app to look at.
 *
 * Takes an options bag rather than (D, t) because it is drawn for whichever
 * day the stepper is on, not only for the newest row.
 *
 * The line is always coloured per-segment by Karvonen zone (HR_GRADIENT) when
 * hrmax/rhr are known, and drawn as one plain polyline otherwise. There is no
 * zone-shaded background any more -- it was visual noise the coloured line
 * already conveyed.
 *
 * `session: true` is for a workout or a drinking window rather than a whole
 * civil day: it skips the 5-minute bucketing (a 20-minute session has too few
 * samples to bucket) and draws from the stored 1-minute curve as-is.
 */
// Google's exerciseType enum runs to dozens of values; this covers the ones
// likely to actually show up from a wrist-worn tracker's auto-detection.
// Short words, one per session -- the heart-rate chart's workout caption
// (app.js's renderDay) lists several on one line, so "Walk" and "Run" keep
// that readable where "Walking workout" and "Running workout" would not.
const WORKOUT_LABEL = {
  WALKING: "Walk", HIKING: "Hike",
  RUNNING: "Run", JOGGING: "Jog", ELLIPTICAL: "Elliptical",
  WEIGHTS: "Lift", STRENGTH_TRAINING: "Lift", WEIGHTLIFTING: "Lift",
  CYCLING: "Bike", BIKING: "Bike",
  SWIMMING: "Swim", ROWING: "Row",
  YOGA: "Yoga", PILATES: "Yoga",
  HIIT: "HIIT", CARDIO_WORKOUT: "Cardio",
  BASKETBALL: "B-ball", SOCCER: "Soccer", TENNIS: "Tennis", GOLF: "Golf",
  DANCING: "Dance", CLIMBING: "Climb",
};
// Falls back to the type's own first word, title-cased, for anything
// Google's enum throws at this that isn't in the map above.
const workoutLabel = (type) => WORKOUT_LABEL[String(type || "").toUpperCase()]
  || String(type || "Workout").toLowerCase().split("_")[0].replace(/^./, (c) => c.toUpperCase());

// A night's own "start" clock time is filed under its WAKE date
// (main_sleeps(), pulse/metrics.py), so bedtime is usually the evening
// BEFORE this chart's own day -- unlike a workout's start, it cannot just be
// rolled forward from tLo the way unroll() does. But the WAKE moment is
// reliably "on this chart's day", exactly like a workout's start is, so it
// rolls forward the same way; bedtime then falls straight out as wake minus
// how long the session ran, in that same frame. No guessing which calendar
// day the bedtime clock reading belongs to.
function nightSpan(start, minutes, tLo) {
  const wake = (mins(start) + minutes) % 1440;
  let e = wake;
  while (e < tLo) e += 1440;
  return [e - minutes, e];
}

function hrIntraday(W, { curve, drinks = [], workouts = [], sleep = null, naps = [], hrmax, rhr, session = false }) {
  // y0 is set well below the top edge to leave a margin for the marker tags
  // that float above the plot: two staggered rows of workout badges, then two
  // staggered rows of drink badges below them, four rows in all.
  const h = 262, x0 = padL(W), x1 = W - padR(W), y0 = 66, y1 = 216, yAxis = 238;
  // A night's row has no curve until that sleep session has ended and synced --
  // push.py only computes hr_curve once sleep_start/sleep_end exist. That is
  // the normal state on every first login of the day, not an error.
  if (!curve?.length) {
    return svg(W, 92, txt(W / 2, 50, "no heart-rate curve stored for this day", { anchor: "middle" }),
      "No heart rate curve for this day");
  }
  // A workout is at most 6h (MAX_SESSION_MIN, metrics.py) and usually well
  // under an hour, so the 5-minute bucketing built for a full 16h day would
  // throw away most of the detail a short session actually has -- a 22-minute
  // walk has only 22 raw samples to begin with, and bucketing to 5-minute
  // means would leave ~4 points. push.py already stores hr_curve at 1-minute
  // resolution, so session charts just draw it as-is.
  const pts = session ? curve : bucket(curve);
  const b = pts.map((p) => p[1]), lo = Math.min(...b) - 8, hi = Math.max(...b) + 8;
  const t = unroll(pts.map((p) => p[0]), mins(pts[0][0]));
  const span = t[t.length - 1] - t[0] || 1;
  // Time-proportional, not index-proportional: a gap in the curve should read
  // as a gap, and the drink markers below have always been placed on the clock.
  // Those two mappings used to be different functions and quietly disagreed.
  const X = (m) => x0 + ((m - t[0]) / span) * (x1 - x0);
  const Y = (v) => y1 - ((v - lo) / ((hi - lo) || 1)) * (y1 - y0);

  let p = "";
  // The 5 Karvonen edges, used to colour the line below per-segment. Null when
  // this day's resting HR has not synced yet -- the line then falls back to a
  // single stroke. No shaded background is drawn from these any more.
  const edges = ok(hrmax) && ok(rhr) ? zoneEdges5(rhr, hrmax) : null;
  // Chart's own clock window -- clips both the workout bands below and the
  // drink markers further down, so declared once rather than twice.
  const tLo = t[0], tHi = t[t.length - 1];

  // Where each sleep block landed, so its length can be written on it after the
  // curve is drawn (see "Sleep block lengths" below).
  const blocks = [];

  // Sleep overlay: same idea as the workout band below, but the night is one
  // object, not a list, and uses nightSpan() rather than unroll() since a
  // late bedtime needs to land BEFORE this chart's start, not rolled forward
  // past it the way a same-day workout time does.
  if (sleep) {
    const [s, e] = nightSpan(sleep.start, Number(sleep.min) || 0, tLo);
    if (!(e < tLo || s > tHi)) {
      const xs = X(Math.max(s, tLo)), xe = X(Math.min(e, tHi));
      p += `<rect x="${xs.toFixed(1)}" y="${y0}" width="${Math.max(xe - xs, 1.5).toFixed(1)}" height="${y1 - y0}"
        fill="${col("rem")}" opacity=".18" data-tip="${esc(`Asleep|${clock12(s)}–${clock12(e)}`)}"/>`;
      // `asleep`, not `min`: min is time in bed, the block's own width. The label
      // says what the Sleep Score tile says, so the two numbers are one number.
      if (ok(sleep.asleep)) blocks.push({ xs, xe, minutes: sleep.asleep, word: "Sleep" });
    }
  }

  // Naps: the same wash as the night, since both are "asleep". A nap starts on
  // this chart's own civil day, so unroll() places it the way it does a workout;
  // nightSpan() is only for a night whose bedtime falls BEFORE the chart starts.
  // The length is time in bed: start + in_bed is the session's end.
  for (const n of naps) {
    const s = unroll([n.start], tLo)[0], e = s + (Number(n.in_bed) || Number(n.min) || 0);
    if (e < tLo || s > tHi) continue;
    const xs = X(Math.max(s, tLo)), xe = X(Math.min(e, tHi));
    p += `<rect x="${xs.toFixed(1)}" y="${y0}" width="${Math.max(xe - xs, 1.5).toFixed(1)}" height="${y1 - y0}"
      fill="${col("rem")}" opacity=".18" data-tip="${esc(`Nap|${clock12(s)}–${clock12(e)}`)}"/>`;
    if (Number(n.min) > 0) blocks.push({ xs, xe, minutes: Number(n.min), word: "Nap" });
  }

  // Workout overlay: a translucent full-height band over each session's own
  // clock span, off by default (see the toggle in app.js's renderDay). Reuses
  // unroll() so a workout starting late and crossing the chart's own midnight
  // wrap lands at the same continuous-minute position the curve itself does;
  // clipping to [tLo, tHi] lets a session that runs past this chart's own
  // window just end at its edge instead of needing next-day data it doesn't have.
  // Each band gets a NUMBERED badge at its top (drawn later, over the line);
  // the number matches this session's entry in the chart's caption below
  // (app.js's renderDay). A spelled-out on-chart label was tried and abandoned
  // -- two sessions an hour apart overlapped into an unreadable smear exactly
  // where the HR trace peaks -- but a single digit is small enough to survive.
  const woMarks = [];
  workouts.forEach((w, wi) => {
    const s = unroll([w.start], tLo)[0];
    const e = s + (Number(w.min) || 0);
    if (e < tLo || s > tHi) return;
    const xs = X(Math.max(s, tLo)), xe = X(Math.min(e, tHi));
    const label = String(w.type || "Workout").toLowerCase().replace(/_/g, " ").replace(/^./, (c) => c.toUpperCase());
    p += `<rect x="${xs.toFixed(1)}" y="${y0}" width="${Math.max(xe - xs, 1.5).toFixed(1)}" height="${y1 - y0}"
      fill="${col("workout")}" opacity=".2" data-tip="${esc(`${label}|${clock12(s)}–${clock12(e)}`)}"/>`;
    woMarks.push({ x: (xs + xe) / 2, n: wi + 1, tip: `${label}|${clock12(s)}–${clock12(e)}` });
  });

  p += grid(x0, x1, [y0, (y0 + y1) / 2, y1]);
  if (edges) {
    // One short segment per consecutive pair rather than one polyline: SVG
    // has no per-vertex stroke color, so a line whose color tracks the zone
    // it's passing through has to be built out of many single-color pieces.
    // Colored by the segment's OWN average bpm, not by which side crosses a
    // threshold -- consistent regardless of which endpoint you'd otherwise
    // have picked.
    for (let i = 0; i < pts.length - 1; i++) {
      const zi = zoneIndex5((pts[i][1] + pts[i + 1][1]) / 2, edges);
      p += `<line x1="${X(t[i]).toFixed(1)}" y1="${Y(pts[i][1]).toFixed(1)}" x2="${X(t[i + 1]).toFixed(1)}" y2="${Y(pts[i + 1][1]).toFixed(1)}"
        stroke="${HR_GRADIENT[zi]}" stroke-width="1.75" stroke-linecap="round"/>`;
    }
  } else {
    p += `<polyline points="${pts.map((q, i) => `${X(t[i]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join(" ")}"
      fill="none" stroke="${col("strain")}" stroke-width="1.5" stroke-linejoin="round"/>`;
  }

  // Drink markers are selected by WHERE THEY FALL, not by which drinking night
  // they belong to. A session runs 9pm to 1am and a civil day cuts it at
  // midnight, so a night key can no longer decide what belongs on this chart:
  // the 1am drinks are the next day's markers on the next day's curve, and the
  // stepper walks between the two halves. Anything outside the drawn window is
  // not this day's business.
  //
  // A fast round -- or a burst of NFC taps -- puts several drinks minutes
  // apart, and on a full-day chart at phone width that's a few pixels: five
  // overlapping numbered dots become an amber smear two staggered rows can't
  // save. So collapse any run of drinks within CLUSTER_MIN of each other into
  // ONE pill labelled with its index range ("3-6"). Time-based, not pixel-
  // based, so a normal 40-minute-apart round still reads as separate dots on
  // the same full-day chart the burst would smear. Every drink's time is in
  // the card's caption (app.js) regardless.
  const R = 6.5, ROWS = [y0 - 12, y0 - 27], CLUSTER_MIN = 8;
  // A drinking-night curve runs past midnight, and t[] above is unrolled to
  // match, so a 1 AM drink is minute 60 of the clock but minute 1500 of this
  // chart. Roll it forward the way unroll() does the curve; a civil-day chart
  // never has a marker that far behind its own start, so nothing changes there.
  const shown = drinks
    .map((s) => { let v = mins(s); if (v < tLo - 3) v += 1440; return { at: s, v }; })
    .filter((d) => d.v >= tLo - 3 && d.v <= tHi + 3)
    .sort((a, b2) => a.v - b2.v)
    .map((d, i) => ({ ...d, n: i + 1, x: X(Math.min(Math.max(d.v, tLo), tHi)) }));

  const groups = [];
  for (const d of shown) {
    const g = groups[groups.length - 1];
    if (g && d.v - g.items[g.items.length - 1].v < CLUSTER_MIN) g.items.push(d);
    else groups.push({ items: [d] });
  }

  let lastX = -1e9, row = 0;
  for (const g of groups) {
    const it = g.items, a = it[0], z = it[it.length - 1];
    const cx = (a.x + z.x) / 2;
    row = cx - lastX < R * 2 + 4 ? 1 - row : 0;
    lastX = cx;
    const cy = ROWS[row], solo = it.length === 1;
    const label = solo ? `${a.n}` : `${a.n}–${z.n}`;
    const tip = solo
      ? `Drink ${a.n}|${t12(a.at)}`
      : `${it.length} drinks (${a.n}–${z.n})|${it.map((d) => t12(d.at)).join(" · ")}`;
    p += `<line x1="${cx.toFixed(1)}" y1="${(cy + R).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${y1}" stroke="${col("drink")}" stroke-width="1.25" opacity=".5"/>`;
    if (solo) {
      p += `<circle cx="${cx.toFixed(1)}" cy="${cy}" r="${R}" fill="${col("drink")}" data-tip="${esc(tip)}"/>`;
    } else {
      const w = Math.min(Math.max(z.x - a.x + R * 2, R * 2 + 6), x1 - x0);
      p += `<rect x="${(cx - w / 2).toFixed(1)}" y="${(cy - R).toFixed(1)}" width="${w.toFixed(1)}" height="${(R * 2).toFixed(1)}" rx="${R.toFixed(1)}" fill="${col("drink")}" data-tip="${esc(tip)}"/>`;
    }
    p += txt(cx, cy + 3.2, label, { size: solo ? 8.5 : 8, anchor: "middle", fill: "bg", weight: 700 });
  }

  // Workout badges: a numbered dot in the top margin ABOVE the drink markers,
  // each at its band's TRUE midpoint x so the stem drops straight onto the
  // band. Auto-detection can log a run of short back-to-back sessions, so the
  // same two-row stagger the drinks use keeps a close pair from merging
  // without shoving either off its band. Rows sit 30px above the drink rows,
  // clear of them. The number is the session's caption index (app.js).
  const WR = 7, WROWS = [y0 - 42, y0 - 57];
  let woLastX = -1e9, woRow = 0;
  woMarks.sort((a, b2) => a.x - b2.x).forEach((m) => {
    const x = Math.min(Math.max(m.x, x0 + WR), x1 - WR);
    woRow = x - woLastX < WR * 2 + 2 ? 1 - woRow : 0;
    woLastX = x;
    const cy = WROWS[woRow];
    p += `<line x1="${x.toFixed(1)}" y1="${(cy + WR).toFixed(1)}" x2="${x.toFixed(1)}" y2="${y0}" stroke="${col("workout")}" stroke-width="1" opacity=".4"/>
      <circle cx="${x.toFixed(1)}" cy="${cy}" r="${WR}" fill="${col("workout")}" data-tip="${esc(m.tip)}"/>
      ${txt(x, cy + 3.4, m.n, { size: 9, anchor: "middle", fill: "bg", weight: 700 })}`;
  });

  // Sleep block lengths: the time asleep, written across the top of each block --
  // the word ("Sleep", "Nap") over the duration. The bands say WHEN and nothing
  // said HOW LONG, and a tooltip is no answer on a phone (marks inside a
  // scrubbable chart are excluded from it). Drawn after the curve so the line
  // never runs through the text.
  //
  // Stacked, not run together on one line, so the word survives a narrow block:
  // on a phone a 3-hour nap is ~40px wide, which fits "2h 26m" but not "Nap 2h
  // 26m" -- and a bare duration on one block beside "Sleep 7h 12m" on the other
  // left the nap unnamed. Both blocks now read the same way at any width.
  //
  // Fit is estimated, not measured -- there is no DOM here to measure with. A
  // duration wider than its block is still written, centred on it and clamped
  // inside the plot, since a label a few pixels wider than a short block reads
  // fine and no label at all reads as a block with no length. A label that would
  // land on the previous one is skipped instead of smeared over it.
  const CW = 5.6;
  let lblRight = -1e9;
  for (const blk of blocks.sort((u, v) => u.xs - v.xs)) {
    const len = dur(blk.minutes);
    const half = (Math.max(len.length, blk.word.length) * CW) / 2;
    const cx = Math.min(Math.max((blk.xs + blk.xe) / 2, x0 + half), x1 - half);
    if (cx - half < lblRight + 4) continue;
    lblRight = cx + half;
    p += txt(cx, y0 + 12, blk.word, { size: 8.5, anchor: "middle", fill: "muted", weight: 600 });
    p += txt(cx, y0 + 25, len, { size: 9.5, anchor: "middle", fill: "text", weight: 700 });
  }

  // Hit bands are on the same time scale as everything else, so they stay
  // aligned across a gap; `data-x` hands the scrubber the centre directly.
  p += pts.map((q, i) => {
    const w = span / Math.max(1, pts.length - 1) / span * (x1 - x0);
    return `<rect data-i="${i}" data-x="${X(t[i]).toFixed(1)}" data-y="${Y(q[1]).toFixed(1)}"
      x="${(X(t[i]) - w / 2).toFixed(1)}" y="${y0}" width="${Math.max(w, 1).toFixed(1)}" height="${y1 - y0}"
      fill="transparent" data-tip="${esc(`${q[1]} bpm|${t12(q[0])}`)}"/>`;
  }).join("");

  p += [lo, (lo + hi) / 2, hi].map((v) => txt(x0 - 7, Y(v) + 4, Math.round(v))).join("");
  p += axis(x0, x1, y1);

  // Hour ticks on the clock, strided to fit. The old version stepped by array
  // index and printed "HH:MM" — at 7 labels on a phone that was a solid smear.
  // Divisor sized for "11 PM" (5 chars), wider than the old lowercase "11p".
  const hourStep = Math.max(1, Math.ceil(span / 60 / Math.max(2, Math.floor(W / 62))));
  const hourTicks = [];
  for (let m = Math.ceil(t[0] / 60) * 60, k = 0; m <= t[t.length - 1]; m += 60, k++) {
    if (k % hourStep) continue;
    hourTicks.push(m);
  }
  // Hour-aligned ticks work for a full day, which always crosses several, but
  // a session under ~2h (any workout) can cross zero or one -- a 56-minute
  // weights set spanning 3:29-4:25 only ever has "4 PM" to show, leaving both
  // ends of the chart unlabeled and the whole thing looking cut off. Below 3
  // ticks, fall back to evenly-spaced marks across the data's OWN start and
  // end instead of the clock's hour grid, so a short chart always shows where
  // it begins and ends. Labeled with minutes (clock12) rather than the bare
  // hour (tick12): four marks inside one hour would otherwise all print the
  // same "5 PM" and look like a labeling bug rather than four real times.
  const short = hourTicks.length < 3;
  const ticks = short ? [0, 1, 2, 3].map((k) => t[0] + (span * k) / 3) : hourTicks;
  ticks.forEach((m, k) => {
    // The fallback's first and last ticks sit exactly on the chart's own
    // edges (t[0] and t[last]) rather than an hour boundary with margin on
    // both sides -- center-anchoring "6:27 PM" there overflows it half past
    // the edge and clips. Anchor those two outward instead; the two middle
    // ticks have room and stay centered.
    const anchor = short && k === 0 ? "start" : short && k === ticks.length - 1 ? "end" : "middle";
    p += txt(X(m), yAxis, short ? clock12(m) : tick12(m), { size: 9.5, anchor });
  });
  p += scrubLayer(y0, y1);
  const descParts = ["zone bands", "drink markers", (sleep || naps.length) && "sleep window", workouts.length && "workout times"].filter(Boolean);
  const desc = descParts.length > 1
    ? `${descParts.slice(0, -1).join(", ")} and ${descParts[descParts.length - 1]}`
    : descParts[0];
  return svg(W, h, p, `Heart rate across the night with ${desc}`, "time");
}

// -------------------------------------------------------------------- bars
function bars(W, D, vals, days, color, fmt, unit) {
  const n = Math.max(1, Math.min(days, D.dates.length));
  const h = 190, x0 = padL(W), x1 = W - padR(W), y0 = 14, y1 = 138, i0 = vals.length - n;
  const v = vals.slice(i0), clean = v.filter(ok);
  const hi = (clean.length ? Math.max(...clean) : 1) * 1.12 || 1;
  const s = scales(x0, x1, y0, y1, n, 0, hi), bw = Math.max(3, Math.min(18, (x1 - x0) / n - 4));
  let p = grid(x0, x1, [y0, (y0 + y1) / 2, y1]), mk = "";
  v.forEach((x, i) => {
    if (!ok(x)) return;
    p += `<rect x="${(s.x(i) - bw / 2).toFixed(1)}" y="${s.y(x).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(1, y1 - s.y(x)).toFixed(1)}" rx="2.5" fill="${color}"/>`;
    if (D.drinks[i0 + i]) mk += `<circle cx="${s.x(i).toFixed(1)}" cy="${y1 + 13}" r="4" fill="${col("drink")}"/>`;
  });
  p += axis(x0, x1, y1) + mk;
  p += hits(n, s, y0, y1 + 20, (i) => {
    const d = D.drinks[i0 + i];
    return `${ok(v[i]) ? Math.round(v[i]).toLocaleString() + " " + unit : "no data"}|${dlabelWd(D.dates[i0 + i], n)}${d ? `|${d} drink${d > 1 ? "s" : ""}` : ""}`;
  }, (i) => (ok(v[i]) ? s.y(v[i]) : null));
  p += [0, hi / 2, hi].map((x) => txt(x0 - 8, s.y(x) + 4, fmt(x))).join("");
  p += dateAxis(W, D.dates, i0, n, s, h - 8);
  p += scrubLayer(y0, y1);
  return svg(W, h, p, `${unit} over ${n} days`, "day");
}

function strainHistory(W, D, days) {
  const n = Math.max(1, Math.min(days, D.dates.length));
  const h = 210, x0 = padL(W), x1 = W - padR(W), y0 = 14, y1 = 158, i0 = D.dates.length - n;
  // `D.target` is the recovery-scaled ceiling — a line to stay under, not a
  // band to fill. Older fixtures may lack it; fall back to a flat 13.
  const tgt = (j) => (Array.isArray(D.target) && ok(D.target[j]) ? D.target[j] : 13);
  const pool = [...D.strain.slice(i0), ...D.dates.slice(i0).map((_, k) => tgt(i0 + k))].filter(ok);
  const hi = (pool.length ? Math.max(...pool) : 18) + 2;
  const s = scales(x0, x1, y0, y1, n, 0, hi), bw = Math.max(3, Math.min(20, (x1 - x0) / n - 5));
  let ceil = "", bar = "", mk = "";
  for (let i = 0; i < n; i++) {
    // j goes negative whenever fewer than `n` nights of data exist yet --
    // requesting 21 days with 6 real nights is the normal state for the
    // first several weeks. D.strain[-9] is undefined, not an error, and
    // s.y(undefined) is NaN -- which the browser then rejects as an SVG
    // coordinate. Skip rather than draw a broken bar.
    const j = i0 + i;
    if (j < 0 || !ok(D.strain[j])) continue;
    const cx = s.x(i), v = D.strain[j], c = tgt(j);
    // A short tick at the ceiling above each bar.
    ceil += `<line x1="${(cx - bw / 2 - 2).toFixed(1)}" y1="${s.y(c).toFixed(1)}"
      x2="${(cx + bw / 2 + 2).toFixed(1)}" y2="${s.y(c).toFixed(1)}" stroke="${col("good")}" stroke-width="2" opacity=".5"/>`;
    bar += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${s.y(v).toFixed(1)}" width="${bw.toFixed(1)}"
      height="${Math.max(1, y1 - s.y(v)).toFixed(1)}" rx="3" fill="${v > c ? col("warn") : col("strain")}"/>`;
    if (D.drinks[j]) mk += `<circle cx="${cx.toFixed(1)}" cy="${y1 + 13}" r="4.5" fill="${col("drink")}"/>
      ${txt(cx, y1 + 16.5, D.drinks[j], { size: 7, anchor: "middle", fill: "bg", weight: 700 })}`;
  }
  const p = grid(x0, x1, [y0, (y0 + y1) / 2, y1]) + ceil + bar + axis(x0, x1, y1) + mk +
    hits(n, s, y0, y1 + 20, (i) => {
      const j = i0 + i;
      if (j < 0 || !ok(D.strain[j])) return `no data|${j < 0 ? "—" : dlabelWd(D.dates[j], n)}`;
      return `${D.strain[j]}|${dlabelWd(D.dates[j], n)} · under ${tgt(j)}${D.drinks[j] ? ` · ${D.drinks[j]} drinks` : ""}`;
    }, (i) => (ok(D.strain[i0 + i]) ? s.y(D.strain[i0 + i]) : null)) +
    [0, hi / 2, hi].map((v) => txt(x0 - 7, s.y(v) + 4, v.toFixed(0))).join("") +
    dateAxis(W, D.dates, i0, n, s, h - 8) + scrubLayer(y0, y1);
  return svg(W, h, p, "Strain against the recovery-scaled ceiling", "day");
}

function stagesVsBaseline(W, D, t) {
  const h = 200, x0 = padL(W), x1 = W - padR(W), y0 = 14, y1 = 152;
  const keys = ["deep", "light", "rem", "awake"];
  const cs = [col("deep"), col("light"), col("rem"), col("awake")];
  const base = keys.map((k) => { const v = D[k].filter(ok); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : NaN; });
  const mine = keys.map((k) => t[k]);
  const pool = [...base, ...mine].filter(ok);
  const hi = (pool.length ? Math.max(...pool) : 60) * 1.15;
  const s = scales(x0, x1, y0, y1, 4, 0, hi);
  const slot = (x1 - x0) / 4, bw = Math.min(34, slot / 2 - 4);
  let p = grid(x0, x1, [y0, (y0 + y1) / 2, y1]);
  keys.forEach((k, i) => {
    const cx = x0 + (i + 0.5) * slot;
    const delta = ok(mine[i]) && ok(base[i]) ? Math.round(mine[i] - base[i]) : null;
    if (ok(base[i])) {
      p += `<rect x="${(cx - bw - 2).toFixed(1)}" y="${s.y(base[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y1 - s.y(base[i])).toFixed(1)}"
        rx="3" fill="${cs[i]}" opacity=".3" data-tip="${esc(`${k.toUpperCase()} baseline|${hm(base[i])} · 30-night average`)}"/>`;
    }
    if (ok(mine[i])) {
      p += `<rect x="${(cx + 2).toFixed(1)}" y="${s.y(mine[i]).toFixed(1)}" width="${bw.toFixed(1)}" height="${(y1 - s.y(mine[i])).toFixed(1)}"
        rx="3" fill="${cs[i]}" data-tip="${esc(`${k.toUpperCase()} this night|${hm(mine[i])}${delta === null ? "" : ` · ${delta >= 0 ? "+" : ""}${delta}m vs baseline`}`)}"/>`;
    }
    p += txt(cx, y1 + 18, k.toUpperCase(), { size: narrow(W) ? 9.5 : 11, anchor: "middle" });
  });
  p += axis(x0, x1, y1);
  p += [0, hi / 2, hi].map((v) => txt(x0 - 8, s.y(v) + 4, Math.round(v) + "m")).join("");
  return svg(W, h, p, "This night's stages against the 30-night average");
}

function debtArea(W, D, days) {
  const n = Math.max(1, Math.min(days, D.dates.length));
  const h = 172, x0 = padL(W), x1 = W - padR(W), y0 = 14, y1 = 128, i0 = D.debt.length - n;
  const v = D.debt.slice(i0).map((x) => (ok(x) ? x : 0));
  const hi = Math.max(...v, 60) * 1.1, s = scales(x0, x1, y0, y1, n, 0, hi);
  const line = v.map((x, i) => `${s.x(i).toFixed(1)},${s.y(x).toFixed(1)}`).join(" ");
  const p = grid(x0, x1, [y0, (y0 + y1) / 2, y1]) +
    `<polygon points="${x0},${y1} ${line} ${x1},${y1}" fill="${col("rem")}" opacity=".22"/>
     <polyline points="${line}" fill="none" stroke="${col("rem")}" stroke-width="2" stroke-linejoin="round"/>` +
    axis(x0, x1, y1) +
    hits(n, s, y0, y1, (i) => `${hm(v[i])} of debt|${dlabelWd(D.dates[i0 + i], n)}`, (i) => s.y(v[i])) +
    // Hours only in the gutter: "12h 00m" needs 44px of a 270px chart, and the
    // half-hour was never the point of a debt trend.
    [0, hi / 2, hi].map((x) => txt(x0 - 7, s.y(x) + 4, Math.round(x / 60) + "h")).join("") +
    dateAxis(W, D.dates, i0, n, s, h - 8) + scrubLayer(y0, y1);
  return svg(W, h, p, "Rolling sleep debt", "day");
}

function sleepColumns(W, D, days) {
  const n = Math.max(1, Math.min(days, D.dates.length));
  const h = 215, x0 = padL(W), x1 = W - padR(W), y0 = 14, y1 = 163, i0 = D.dates.length - n;
  const s = scales(x0, x1, y0, y1, n, 0, 18 * 60), bw = Math.max(3, Math.min(24, (x1 - x0) / n - 6));
  let p = grid(x0, x1, [y0, (y0 + y1) / 2, y1]);
  for (let i = 0; i < n; i++) {
    const j = i0 + i; if (j < 0 || !ok(D.asleep[j])) continue;
    const cx = s.x(i);
    let y = y1 - (D.asleep[j] / (18 * 60)) * (y1 - y0);
    for (const [k, c] of [["deep", col("deep")], ["light", col("light")], ["rem", col("rem")], ["awake", col("awake")]]) {
      const hh = ((D[k][j] || 0) / (18 * 60)) * (y1 - y0);
      p += `<rect x="${(cx - bw / 2).toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, hh - 1).toFixed(1)}" fill="${c}"/>`;
      y += hh;
    }
    if (D.drinks[j]) p += `<circle cx="${cx.toFixed(1)}" cy="${y1 + 13}" r="4" fill="${col("drink")}"/>`;
  }
  p += axis(x0, x1, y1);
  p += hits(n, s, y0, y1 + 20, (i) => {
    const j = i0 + i;
    if (j < 0 || !ok(D.asleep[j])) return `no data|${j < 0 ? "—" : dlabelWd(D.dates[j], n)}`;
    return `${hm(D.asleep[j])}|${dlabelWd(D.dates[j], n)} · REM ${hm(D.rem[j])} · deep ${hm(D.deep[j])}${D.drinks[j] ? `|${D.drinks[j]} drinks` : ""}`;
  });
  p += [0, 4, 8, 12].map((hh) => txt(x0 - 8, s.y(hh * 60) + 4, hh + "h")).join("");
  p += dateAxis(W, D.dates, i0, n, s, h - 8) + scrubLayer(y0, y1);
  return svg(W, h, p, "Sleep duration and composition over recent nights", "day");
}

function sparkline(W, D, vals, color, days, unit) {
  const n = Math.max(1, Math.min(days, D.dates.length));
  const h = 158, x0 = padL(W), x1 = W - padR(W), y0 = 14, y1 = 118, i0 = vals.length - n;
  const v = vals.slice(i0), cl = v.filter(ok);
  if (!cl.length) return svg(W, 92, txt(W / 2, 50, "no data in this window", { anchor: "middle" }), "no data");
  const lo = Math.min(...cl) * 0.94, hi = Math.max(...cl) * 1.06, s = scales(x0, x1, y0, y1, n, lo, hi);
  let d = "", prev = false, mk = "";
  v.forEach((x, i) => {
    if (!ok(x)) { prev = false; return; }
    d += (prev ? " L" : " M") + `${s.x(i).toFixed(1)},${s.y(x).toFixed(1)}`; prev = true;
    if (D.drinks[i0 + i]) mk += `<circle cx="${s.x(i).toFixed(1)}" cy="${s.y(x).toFixed(1)}" r="3.6"
      fill="${col("drink")}" stroke="${col("panel")}" stroke-width="1.5"/>`;
  });
  const p = grid(x0, x1, [y0, (y0 + y1) / 2, y1]) +
    `<path d="${d.trim()}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` + mk +
    axis(x0, x1, y1) +
    hits(n, s, y0, y1, (i) => {
      const j = i0 + i;
      return `${ok(v[i]) ? v[i] + " " + unit : "no data"}|${dlabelWd(D.dates[j], n)}${D.drinks[j] ? `|after ${D.drinks[j]} drinks` : ""}`;
    }, (i) => (ok(v[i]) ? s.y(v[i]) : null)) +
    // The unit rides on the top label only; repeating "ms" three times down a
    // 270px gutter is noise, and the card title already says what this is.
    [lo, (lo + hi) / 2, hi].map((x, k) => txt(x0 - 8, s.y(x) + 4, Math.round(x) + (k === 2 && unit && !narrow(W) ? " " + unit : ""))).join("") +
    dateAxis(W, D.dates, i0, n, s, h - 8) + scrubLayer(y0, y1);
  return svg(W, h, p, `Trend over ${n} days`, "day");
}

// The payoff chart.
// Percentage-of-baseline points, shared by doseResponse() and slope() so the
// two can't quietly disagree the way the chart and the Today-tab strip once
// did. Each point prefers ITS OWN night's stored hrv_baseline -- a trailing
// 30-day median computed server-side, excluding that night itself -- over a
// single whole-account mean. The mean is only a fallback (an account with
// under 3 prior nights, or a fixture with no baseline column at all): as a
// shared denominator across every point it drifts every past night's
// percentage retroactively each time a new one arrives, which a per-night
// value never does. Verified against real data: the two methods gave 77.5%
// vs 82% for the same night.
function pctPoints(D) {
  const hasStored = Array.isArray(D.hrvBaseline);
  const sober = D.hrv.filter((_, i) => !D.drinks[i] && ok(D.hrv[i]));
  const wholeHistoryMean = sober.reduce((a, b) => a + b, 0) / sober.length;
  const pts = [];
  for (let i = 0; i < D.dates.length; i++) {
    if (!ok(D.hrv[i])) continue;
    const base = hasStored && ok(D.hrvBaseline[i]) ? D.hrvBaseline[i] : wholeHistoryMean;
    pts.push([D.drinks[i], (D.hrv[i] / base) * 100, D.dates[i], D.hrv[i]]);
  }
  return { pts, wholeHistoryMean };
}

function doseResponse(W, D) {
  const h = 258, x0 = padL(W) + 6, x1 = W - padR(W) - (narrow(W) ? 4 : 16), y0 = 16, y1 = 196;
  const { pts } = pctPoints(D);
  if (!pts.length) return svg(W, 92, txt(W / 2, 50, "no HRV recorded yet", { anchor: "middle" }), "no data");

  // Deterministic per-render jitter, so drinks (integers) don't stack into one
  // opaque column. Seeded, so the layout is stable across renders.
  const newJit = () => { let s = 7; return () => { s = (s * 1103515245 + 12345) & 0x7fffffff; return (s / 0x7fffffff - 0.5) * 0.34; }; };

  // Deep-sleep RMSSD as a second, hollow series where it has its own baseline --
  // no fit line (too few drinking nights, and its baseline is still settling),
  // just the points, so you can see it drop harder than the average on a
  // drinking night. Built first so its % values widen the y-domain too. The
  // jitter is baked in here off a stream advanced once per night that is in the
  // PRIMARY series -- so a night present in both lands its two dots on the same
